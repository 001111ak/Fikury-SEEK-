<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Fikury SEEK</title>
  <style>
/* ===== CSS Variables ===== */
:root {
  --bg-primary: #0c1e36;
  --bg-secondary: #132b4a;
  --bg-tertiary: #1a3658;
  --bg-hover: #214370;
  --bg-input: #16304f;
  --border: #2a4a72;
  --border-light: #355d8a;
  --text-primary: #eef5ff;
  --text-secondary: #9bb4d4;
  --text-muted: #6b8aaf;
  --accent: #3b9eff;
  --accent-hover: #2b8aef;
  --accent-soft: rgba(59, 158, 255, 0.18);
  --user-bubble: #1e4a7a;
  --ai-bubble: #16304f;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  --radius: 16px;
  --radius-sm: 10px;
  --sidebar-width: 270px;
  --transition: 0.25s ease;
}

[data-theme="light"] {
  --bg-primary: #f5f8fc;
  --bg-secondary: #ffffff;
  --bg-tertiary: #eef3f9;
  --bg-hover: #e4ecf6;
  --bg-input: #ffffff;
  --border: #d0dce8;
  --border-light: #e2ebf5;
  --text-primary: #0f2137;
  --text-secondary: #4a6480;
  --text-muted: #7a92a8;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: rgba(37, 99, 235, 0.1);
  --user-bubble: #dbeafe;
  --ai-bubble: #ffffff;
  --shadow: 0 4px 24px rgba(15, 33, 55, 0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  transition: background var(--transition), color var(--transition);
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
textarea { font-family: inherit; border: none; outline: none; resize: none; background: transparent; color: var(--text-primary); }
.app { display: flex; height: 100dvh; max-height: 100dvh; overflow: hidden; width: 100%; }

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: transform var(--transition), background var(--transition);
  z-index: 100;
  flex-shrink: 0;
}
.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 16px 12px;
}
.logo-area { display: flex; align-items: center; gap: 10px; }
.logo-img {
  width: 42px; height: 42px; border-radius: 50%; object-fit: cover;
  background: transparent; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.logo-text {
  font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em;
  background: linear-gradient(135deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
[data-theme="light"] .logo-text {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  -webkit-background-clip: text; background-clip: text;
}
.close-sidebar { display: none; }
.new-chat-btn {
  display: flex; align-items: center; gap: 10px;
  margin: 4px 12px 16px; padding: 12px 16px;
  border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent);
  font-weight: 600; font-size: 0.95rem; transition: background var(--transition), transform 0.15s;
}
.new-chat-btn:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }
.chat-history {
  flex: 1; overflow-y: auto; padding: 0 8px 12px;
  display: flex; flex-direction: column; gap: 2px;
}
.history-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 8px; font-size: 0.875rem; color: var(--text-secondary);
  transition: background var(--transition); text-align: left; width: 100%; min-width: 0; overflow: hidden;
}
.history-item:hover, .history-item.active { background: var(--bg-hover); color: var(--text-primary); }
.history-item .hist-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-item .hist-delete { opacity: 0; padding: 4px; border-radius: 4px; color: var(--text-muted); transition: opacity 0.15s; }
.history-item:hover .hist-delete { opacity: 1; }
.hist-delete:hover { color: #ef4444; background: rgba(239,68,68,0.1); }
.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.sidebar-action { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.875rem; color: var(--text-secondary); transition: background var(--transition); width: 100%; }
.sidebar-action:hover { background: var(--bg-hover); color: var(--text-primary); }
.theme-toggle-wrap { margin-top: 4px; }
.theme-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.875rem; color: var(--text-secondary); width: 100%; transition: background var(--transition); }
.theme-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.sun-icon { display: none; }
.moon-icon { display: block; }
[data-theme="light"] .sun-icon { display: block; }
[data-theme="light"] .moon-icon { display: none; }

/* ===== Main ===== */
.main {
  flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%;
  background: var(--bg-primary); transition: background var(--transition); position: relative;
}
.topbar {
  display: flex; align-items: center; gap: 6px; padding: 4px 8px;
  border-bottom: 1px solid var(--border); background: var(--bg-primary);
  transition: background var(--transition), border-color var(--transition);
  min-height: 44px; height: 44px; position: relative; z-index: 50;
  flex-shrink: 0; width: 100%; box-sizing: border-box;
}
.menu-btn { display: none; }
.icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 8px;
  color: var(--text-secondary); transition: background var(--transition), color var(--transition);
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.model-selector { position: relative; }
.model-btn {
  display: flex; align-items: center; gap: 4px; padding: 6px 10px;
  border-radius: 8px; font-weight: 600; font-size: 1rem; color: var(--text-primary);
  transition: background var(--transition);
}
.model-btn:hover { background: var(--bg-hover); }
.model-dropdown {
  position: absolute; top: calc(100% + 6px); left: 0; min-width: 160px;
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow); padding: 6px; display: none; z-index: 50;
}
.model-dropdown.open { display: block; }
.model-option {
  display: block; width: 100%; text-align: left; padding: 10px 12px;
  border-radius: 6px; font-size: 0.9rem; color: var(--text-secondary);
  transition: background var(--transition);
}
.model-option:hover, .model-option.active { background: var(--bg-hover); color: var(--text-primary); }
.model-option.active { font-weight: 600; color: var(--accent); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }

/* ===== Chat Container ===== */
.chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-height: 0; -webkit-overflow-scrolling: touch; }
.welcome {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 12px 16px 16px; text-align: center; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.welcome-logo {
  width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
  margin: 4px 0 8px 0; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  background: transparent; border: none;
}
.welcome h1 {
  font-size: 1.4rem; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 4px 0;
  background: linear-gradient(135deg, #60a5fa, #a78bfa, #38bdf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
[data-theme="light"] .welcome h1 {
  background: linear-gradient(135deg, #2563eb, #7c3aed, #0891b2);
  -webkit-background-clip: text; background-clip: text;
}
.tagline { color: var(--text-secondary); font-size: 0.9rem; margin: 0 0 14px 0; }
.suggestion-grid { display: grid; grid-template-columns: 1fr; gap: 8px; max-width: 420px; width: 100%; }
@media (min-width: 600px) {
  .suggestion-grid { grid-template-columns: repeat(2, 1fr); max-width: 560px; gap: 12px; }
}
.suggestion {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: 14px;
  text-align: left; font-size: 0.875rem; color: var(--text-secondary);
  transition: border-color var(--transition), background var(--transition), transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.suggestion:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--text-primary); transform: translateY(-2px); }
.sug-icon { font-size: 1.2rem; flex-shrink: 0; }

/* Messages */
.messages { display: none; flex-direction: column; gap: 12px; padding: 16px 16px 28px; max-width: 800px; width: 100%; margin: 0 auto; min-height: 0; }
.messages.active { display: flex; }
.message { display: flex; gap: 14px; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.message.user { justify-content: flex-end; }
.bubble { max-width: 75%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
.ai .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.typing-indicator { display: flex; gap: 5px; padding: 8px 4px; }
.typing-indicator span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.2s infinite; }
.typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity:0.4; } 30% { transform: translateY(-5px); opacity:1; } }

/* ===== Input Area ===== */
.input-area { padding: 10px 14px 16px; background: transparent; border-top: none; position: sticky; bottom: 0; z-index: 40; flex-shrink: 0; }
.input-wrapper {
  display: flex; align-items: flex-end; gap: 6px; max-width: 800px; margin: 0 auto;
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 28px;
  padding: 10px 12px 10px 8px; box-shadow: 0 6px 28px rgba(0,0,0,0.35);
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}
.input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
#userInput { flex: 1; padding: 8px 4px; font-size: 0.95rem; line-height: 1.45; max-height: 160px; min-height: 24px; }
#userInput::placeholder { color: var(--text-muted); }
.send-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff;
  flex-shrink: 0; transition: background var(--transition), opacity var(--transition), transform 0.15s;
}
.send-btn:hover:not(:disabled) { background: var(--accent-hover); transform: scale(1.05); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.stop-btn {
  display: none; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%; background: #ef4444; color: #fff;
  flex-shrink: 0; transition: transform 0.15s, opacity 0.15s;
}
.stop-btn:active { transform: scale(0.95); }
.send-btn.hidden { display: none !important; }
.stop-btn.visible { display: flex !important; }
.disclaimer { text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 10px; }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border);
  padding: 12px 20px; border-radius: 10px; font-size: 0.875rem; box-shadow: var(--shadow);
  opacity: 0; transition: transform 0.3s ease, opacity 0.3s ease; z-index: 200; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ===== Attach Menu ===== */
.attach-menu {
  position: fixed; bottom: 88px; left: 16px; right: 16px; max-width: 340px; margin: 0 auto;
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 20px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.4); padding: 10px; display: none; flex-direction: column;
  gap: 4px; z-index: 150; opacity: 0; transform: translateY(12px) scale(0.97);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.attach-menu.open { display: flex; opacity: 1; transform: translateY(0) scale(1); }
.attach-option {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px;
  font-size: 0.95rem; font-weight: 500; color: var(--text-primary);
  transition: background 0.15s; width: 100%; text-align: left; border: none; background: transparent; cursor: pointer;
}
.attach-option:active { background: var(--bg-hover); }
.opt-icon {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  border-radius: 12px; font-size: 1.25rem; background: var(--accent-soft); flex-shrink: 0;
}
.attach-option#optCamera .opt-icon { background: rgba(59,130,246,0.15); }
.attach-option#optPhoto .opt-icon { background: rgba(16,185,129,0.15); }
.attach-option#optFile .opt-icon { background: rgba(168,85,247,0.15); }
.attach-option#optClose .opt-icon { background: rgba(239,68,68,0.12); }
.attach-option#optClose { color: var(--text-secondary); }
.attach-btn { color: var(--text-secondary); }
.attach-btn:active, .attach-btn.active { color: var(--accent); background: var(--accent-soft); }

/* ===== Markdown ===== */
.md-body, .stream-text { line-height: 1.65; font-size: 0.98rem; word-break: break-word; }
.md-p { margin: 0 0 0.65em 0; }
.md-p:last-child { margin-bottom: 0; }
.md-h1, .md-h2, .md-h3 { font-weight: 700; margin: 0.8em 0 0.35em; color: var(--text-primary); }
.md-h1 { font-size: 1.15rem; }
.md-h2 { font-size: 1.08rem; }
.md-h3 { font-size: 1.02rem; }
.md-list { margin: 0.4em 0 0.6em 1.1em; padding: 0; }
.md-list li { margin: 0.2em 0; }
.md-code {
  display: block; background: var(--bg-tertiary, var(--bg-secondary)); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px; margin: 8px 0; overflow-x: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.82rem; line-height: 1.45; white-space: pre;
}
.md-inline { background: var(--bg-hover); border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.88em; }
.message.ai .bubble.ai-text { max-width: 100%; padding: 6px 2px 10px; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); box-shadow: var(--shadow); }
  .sidebar.open { transform: translateX(0); }
  .close-sidebar { display: flex; }
  .menu-btn { display: flex; }
  .suggestion-grid { grid-template-columns: 1fr; }
  .bubble { max-width: 85%; }
  .welcome h1 { font-size: 1.5rem; }
  .welcome-logo { width: 72px; height: 72px; }
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none;
  align-items: center; justify-content: center; z-index: 300; padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px;
  width: 100%; max-width: 400px; box-shadow: var(--shadow); overflow: hidden;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 1.1rem; font-weight: 600; }
.modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.modal-body label { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; }
.modal-body input, .modal-body select {
  padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-input); color: var(--text-primary); font-size: 0.9rem; outline: none;
}
.modal-body input:focus, .modal-body select:focus { border-color: var(--accent); }
.modal-footer { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); justify-content: flex-end; }
.modal-btn { padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; }
.modal-btn.primary { background: var(--accent); color: #fff; }
.modal-btn.secondary { background: var(--bg-hover); color: var(--text-primary); }

/* Confirm modal */
#confirmModal.modal-overlay { align-items: center !important; justify-content: center !important; padding: 20px !important; background: rgba(0,0,0,0.55) !important; }
#confirmModal .confirm-modal { width: 100% !important; max-width: 320px !important; border-radius: 16px !important; overflow: hidden !important; }
#confirmModal .confirm-body { padding: 24px 20px 12px !important; text-align: center !important; }
#confirmModal .confirm-body p { margin: 0 !important; font-size: 1.05rem !important; font-weight: 600 !important; color: var(--text-primary) !important; line-height: 1.4 !important; }
#confirmModal .modal-footer { justify-content: center !important; gap: 12px !important; padding: 12px 16px 18px !important; border-top: none !important; }
#confirmModal .modal-btn { min-width: 100px !important; }

.file-card {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 12px; background: var(--bg-hover); border: 1px solid var(--border);
  margin-bottom: 6px; max-width: 280px; text-align: left;
}
.file-card-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(239,68,68,0.15); color: #ef4444; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
.file-card-info { min-width: 0; flex: 1; }
.file-card-name { font-weight: 600; font-size: 0.88rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-card-meta { font-size: 0.75rem; color: var(--text-muted); }

.msg-image {
  display: block !important; width: auto !important; max-width: min(260px, 75vw) !important;
  max-height: 280px !important; border-radius: 12px !important; margin: 0 0 8px 0 !important;
  object-fit: contain !important; border: 1px solid var(--border); background: var(--bg-secondary);
  visibility: visible !important; opacity: 1 !important;
}
.user .bubble { display: flex; flex-direction: column; align-items: flex-end; }
.msg-actions { display: flex; gap: 6px; margin-top: 8px; opacity: 0.5; transition: opacity 0.2s; }
.message.ai:hover .msg-actions, .message.ai:active .msg-actions { opacity: 1; }
.msg-action-btn {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 6px; color: var(--text-muted);
  transition: background 0.15s, color 0.15s;
}
.msg-action-btn:hover, .msg-action-btn:active { background: var(--bg-hover); color: var(--text-primary); }

.model-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.model-chip { padding: 6px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: var(--bg-hover); color: var(--text-secondary); border: 1px solid var(--border); transition: background 0.15s, color 0.15s; }
.model-chip:active, .model-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.deep-toggle { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin: 4px 0; font-size: 0.85rem; color: var(--text-secondary); }
.deep-toggle input { accent-color: var(--accent); }

/* Mobile fit */
html, body { height: 100dvh; margin: 0; overflow: hidden; position: fixed; inset: 0; overscroll-behavior: none; background: var(--bg-primary) !important; }
#app, .app { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; display: flex !important; overflow: hidden !important; }
.main { flex: 1 !important; display: flex !important; flex-direction: column !important; min-width: 0 !important; min-height: 0 !important; height: 100% !important; overflow: hidden !important; }
.topbar { flex: 0 0 auto !important; display: flex !important; align-items: center !important; min-height: 44px !important; height: 44px !important; padding: 0 8px !important; z-index: 100 !important; width: 100% !important; box-sizing: border-box !important; }
.chat-container { flex: 1 1 auto !important; min-height: 0 !important; overflow-y: auto !important; -webkit-overflow-scrolling: touch !important; }
.input-area { flex: 0 0 auto !important; width: 100% !important; box-sizing: border-box !important; padding: 8px 12px !important; padding-bottom: max(10px, calc(8px + env(safe-area-inset-bottom,0px))) !important; }
.welcome { justify-content: flex-start !important; padding: 12px 16px !important; width: 100% !important; box-sizing: border-box !important; }
.welcome-logo { width: 72px !important; height: 72px !important; margin: 4px 0 8px !important; }

.sidebar { max-width: 85vw !important; }
.modal { max-width: min(400px, 94vw) !important; max-height: 90vh !important; overflow-y: auto !important; }

@media (max-width: 480px) {
  .topbar { height: 44px !important; min-height: 44px !important; }
  .welcome-logo { width: 64px !important; height: 64px !important; }
  .welcome h1 { font-size: 1.25rem !important; }
  .suggestion { padding: 10px 12px !important; font-size: 0.9rem !important; }
  .message { padding-left: 10px !important; padding-right: 10px !important; }
  .bubble { max-width: 88% !important; }

  .menu-btn { display: none !important; }
  .sidebar { position: relative !important; transform: none !important; max-width: 280px !important; width: 260px !important; }
  .suggestion-grid { grid-template-columns: 1fr 1fr !important; max-width: 560px !important; }
  .welcome { justify-content: center !important; padding-top: 24px !important; }
  .welcome-logo { width: 100px !important; height: 100px !important; }
  .bubble { max-width: 70% !important; }

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-area">
        <img id="sidebarLogo" alt="Fikury SEEK" class="logo-img" />
        <span class="logo-text">Fikury SEEK</span>
      </div>
      <button class="icon-btn close-sidebar" id="closeSidebar" title="Close sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="chat-history" id="chatHistory"></div>
    <div class="sidebar-footer">
      <button class="sidebar-action" id="settingsBtn" title="AI Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        AI Settings
      </button>
      <button class="sidebar-action" id="clearAllBtn" title="Clear all chats">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
        Clear all
      </button>
      <div class="theme-toggle-wrap">
        <button class="theme-btn" id="themeToggle" title="Toggle theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <span class="theme-label">Theme</span>
        </button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="Open sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="model-selector" id="modelSelector">
        <button class="model-btn" id="modelBtn">
          <span id="currentModel">Fikury 1.5</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="model-dropdown" id="modelDropdown">
          <button class="model-option active" data-model="Fikury 1.5">Fikury 1.5</button>
          <button class="model-option" data-model="Fikury Pro">Fikury Pro</button>
          <button class="model-option" data-model="Fikury Flash">Fikury Flash</button>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeTopBtn" title="Toggle theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button class="icon-btn" id="backBtn" title="Back to home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <button class="icon-btn" id="newChatTopBtn" title="New chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
      </div>
    </header>

    <div class="chat-container" id="chatContainer">
      <div class="welcome" id="welcomeScreen">
        <img id="welcomeLogo" alt="Fikury SEEK" class="welcome-logo" />
        <h1>Fikury SEEK</h1>
        <p class="tagline">Seek deeper. Think clearer.</p>
        <div class="suggestion-grid">
          <button class="suggestion" data-prompt="Explain quantum computing in simple terms"><span class="sug-icon">⚛️</span><span>Explain quantum computing simply</span></button>
          <button class="suggestion" data-prompt="Write a short poem about the ocean"><span class="sug-icon">🌊</span><span>Write a poem about the ocean</span></button>
          <button class="suggestion" data-prompt="Help me plan a productive day"><span class="sug-icon">📅</span><span>Help me plan a productive day</span></button>
          <button class="suggestion" data-prompt="What are the latest AI trends in 2026?"><span class="sug-icon">🤖</span><span>Latest AI trends in 2026</span></button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <button class="icon-btn attach-btn" id="attachBtn" title="Add photo, file or camera">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="userInput" placeholder="Ask Fikury SEEK anything..." rows="1" maxlength="8000"></textarea>
        <button class="icon-btn mic-btn" id="micBtn" title="Voice input">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
        </button>
        <button class="send-btn" id="sendBtn" title="Send" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button class="stop-btn" id="stopBtn" title="Stop" style="display:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
      <p class="disclaimer">Fikury SEEK can make mistakes. Double-check important information.</p>
    </div>
  </main>
</div>

<!-- Hidden file inputs -->
<input type="file" id="fileInput" accept="*/*" style="display:none" />
<input type="file" id="photoInput" accept="image/*" style="display:none" multiple="false" />
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" />
<input type="file" id="docInput" accept=".pdf,.doc,.docx,.txt,.md,.csv,.json,.xml,.html,.htm,.rtf,.odt,.ods,.odp,.xls,.xlsx,.ppt,.pptx,.epub,.log,.js,.ts,.py,.java,.c,.cpp,.h,.css,.sql,.yaml,.yml,.ini,.cfg,.env,application/pdf,text/*,application/msword,application/vnd.openxmlformats-officedocument.*,application/vnd.ms-excel,application/vnd.ms-powerpoint,application/rtf,application/json,application/xml" style="display:none" />

<!-- Attach options menu -->
<div class="attach-menu" id="attachMenu">
  <button class="attach-option" id="optCamera"><span class="opt-icon">📷</span> Camera</button>
  <button class="attach-option" id="optPhoto"><span class="opt-icon">🖼️</span> Photo</button>
  <button class="attach-option" id="optFile"><span class="opt-icon">📄</span> File</button>
  <button class="attach-option" id="optClose"><span class="opt-icon">✕</span> Cancel</button>
</div>

<!-- AI Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header"><h3>AI Settings</h3><button class="icon-btn" id="closeSettings">✕</button></div>
    <div class="modal-body">
      <label>Provider</label>
      <select id="aiProvider">
        <option value="backend">Backend (Netlify Function)</option>

        <option value="openai">OpenAI / Compatible (browser key)</option>
        <option value="offline">Offline (simulated)</option>

      <label>API Key</label>
      <input type="password" id="apiKeyInput" placeholder="Paste your API key here" />
      <label>Model (optional)</label>
      <input type="text" id="modelInput" placeholder="gemini-2.0-flash, gemini-2.5-flash, gemini-3.5, gemini-3.6..." />
      <label>Base URL (for OpenAI-compatible only)</label>
      <input type="text" id="baseUrlInput" placeholder="https://api.openai.com/v1" />
      <label>Quick models (Gemini)</label>
      <div class="model-chips" id="modelChips">

        <button type="button" class="model-chip" data-model="gemini-2.0-flash">2.0 Flash</button>

        <button type="button" class="model-chip" data-model="gemini-2.5-flash">2.5 Flash</button>
        <button type="button" class="model-chip" data-model="gemini-2.5-pro">2.5 Pro</button>
        <button type="button" class="model-chip" data-model="gemini-3.5">3.5</button>
        <button type="button" class="model-chip" data-model="gemini-3.5-flash">3.5 Flash</button>
        <button type="button" class="model-chip" data-model="gemini-3.5-pro">3.5 Pro</button>
        <button type="button" class="model-chip" data-model="gemini-3.6">3.6</button>
        <button type="button" class="model-chip" data-model="gemini-3.6-flash">3.6 Flash</button>
        <button type="button" class="model-chip" data-model="gemini-3.6-pro">3.6 Pro</button>
        <button type="button" class="model-chip" data-model="gemini-exp">Exp</button>
        <button type="button" class="model-chip" data-model="gemini-pro">Pro</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn secondary" id="cancelSettings">Cancel</button>
      <button class="modal-btn primary" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">

</div>

function initTheme() {
  const saved = localStorage.getItem("fikury_theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("fikury_theme", next);
  showToast(next === "dark" ? "Dark mode enabled" : "Light mode enabled");
}

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

function showConfirm(message) {
  return new Promise(function(resolve) {
    const modal = document.getElementById("confirmModal");
    const msg = document.getElementById("confirmMessage");
    const ok = document.getElementById("confirmOk");
    const cancel = document.getElementById("confirmCancel");
    if (!modal || !ok || !cancel) { resolve(window.confirm(message)); return; }
    msg.textContent = message;
    modal.classList.add("open");
    function cleanup(result) {
      modal.classList.remove("open");
      ok.removeEventListener("click", onOk);
      cancel.removeEventListener("click", onCancel);
      modal.removeEventListener("click", onBackdrop);
      resolve(result);
    }
    function onOk(e) { e.stopPropagation(); cleanup(true); }
    function onCancel(e) { e.stopPropagation(); cleanup(false); }
    function onBackdrop(e) { if (e.target === modal) cleanup(false); }
    ok.addEventListener("click", onOk);
    cancel.addEventListener("click", onCancel);
    modal.addEventListener("click", onBackdrop);
  });
}

function openSidebar() {
  sidebar.classList.add("open");
  const bd = document.getElementById("sidebarBackdrop");
  if (bd) bd.classList.add("show");
}
function closeSidebarFn() {
  sidebar.classList.remove("open");
  const bd = document.getElementById("sidebarBackdrop");
  if (bd) bd.classList.remove("show");
}

function toggleModelDropdown() {
  modelDropdown.classList.toggle("open");
}

function selectModel(e) {
  const opt = e.target.closest(".model-option");
  if (!opt) return;
  $$(".model-option").forEach((o) => o.classList.remove("active"));
  opt.classList.add("active");
  currentModelEl.textContent = opt.dataset.model;
  modelDropdown.classList.remove("open");
  showToast(`Switched to ${opt.dataset.model}`);
}

function saveChats() {
  localStorage.setItem("fikury_chats", JSON.stringify(chats));
}

function createChat(title = "New chat") {
  const chat = { id: Date.now().toString(), title, messages: [], createdAt: new Date().toISOString() };
  chats.unshift(chat);
  currentChatId = chat.id;
  saveChats();
  renderHistory();
  return chat;
}

function getCurrentChat() {
  return chats.find((c) => c.id === currentChatId);
}

function startNewChat() {
  currentChatId = null;
  messagesEl.innerHTML = "";
  messagesEl.classList.remove("active");
  welcomeScreen.style.display = "flex";
  userInput.value = "";
  autoResize();
  updateSendBtn();
  renderHistory();
  closeSidebarFn();
  showToast("New chat started");
}

function loadChat(id) {
  currentChatId = id;
  const chat = getCurrentChat();
  if (!chat) return;
  welcomeScreen.style.display = "none";
  messagesEl.classList.add("active");
  messagesEl.innerHTML = "";
  chat.messages.forEach((m) => appendMessage(m.role, m.content, false, m.image || null));
  renderHistory();
  closeSidebarFn();
  scrollToBottom();
}

function deleteChat(id, e) {
  e.stopPropagation();
  chats = chats.filter((c) => c.id !== id);
  saveChats();
  if (currentChatId === id) startNewChat();
  else renderHistory();
  showToast("Chat deleted");
}

async function clearAllChats() {
  if (!chats.length) { showToast("No chats to clear"); return; }
  const ok = await showConfirm("Clear all chat history?");
  if (!ok) return;
  chats = [];
  saveChats();
  startNewChat();
  showToast("All chats cleared");
}

function renderHistory() {
  chatHistory.innerHTML = "";
  if (!chats.length) {
    chatHistory.innerHTML = `<p style="padding:12px;color:var(--text-muted);font-size:0.85rem;text-align:center;">No chats yet</p>`;
    return;
  }
  chats.forEach((chat) => {
    const btn = document.createElement("button");
    btn.className = `history-item${chat.id === currentChatId ? " active" : ""}`;
    let displayTitle = (chat.title || "Chat").trim();
    if (/^\d{12,}$/.test(displayTitle)) displayTitle = "Chat";
    if (displayTitle.length > 28) displayTitle = displayTitle.slice(0, 28) + "…";
    btn.innerHTML = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;opacity:0.6"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span class="hist-title">${escapeHtml(displayTitle)}</span>
      <span class="hist-delete" title="Delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
    `;
    btn.addEventListener("click", () => loadChat(chat.id));
    btn.querySelector(".hist-delete").addEventListener("click", (e) => deleteChat(chat.id, e));
    chatHistory.appendChild(btn);
  });
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function copyToClipboard(text) {
  const str = String(text == null ? "" : text);
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(str).then(() => true).catch(() => copyFallback(str));
  }
  return Promise.resolve(copyFallback(str));
}
function copyFallback(str) {
  try {
    const ta = document.createElement("textarea");
    ta.value = str;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return !!ok;
  } catch (e) { return false; }
}

function formatMarkdown(text) {
  if (!text) return "";
  let s = escapeHtml(String(text));
  s = s.replace(/```([\w+-]*)\n([\s\S]*?)```/g, function(_, lang, code) {
    return '<pre class="md-code"><code>' + code.replace(/\n$/, "") + '</code></pre>';
  });
  s = s.replace(/`([^`\n]+)`/g, '<code class="md-inline">$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/^### (.+)$/gm, '<div class="md-h3">$1</div>');
  s = s.replace(/^## (.+)$/gm, '<div class="md-h2">$1</div>');
  s = s.replace(/^# (.+)$/gm, '<div class="md-h1">$1</div>');
  s = s.replace(/^(?:[-•*]\s+.+(?:\n|$))+ /gm, function(block) {
    const items = block.trim().split(/\n/).map(function(line) {
      return "<li>" + line.replace(/^[-•*]\s+/, "") + "</li>";
    }).join("");
    return "<ul class=\"md-list\">" + items + "</ul>";
  });
  s = s.replace(/^(?:\d+\.\s+.+(?:\n|$))+ /gm, function(block) {
    const items = block.trim().split(/\n/).map(function(line) {
      return "<li>" + line.replace(/^\d+\.\s+/, "") + "</li>";
    }).join("");
    return "<ol class=\"md-list\">" + items + "</ol>";
  });
  s = s.replace(/\n\n/g, "</p><p class=\"md-p\">");
  s = s.replace(/\n/g, "<br>");
  s = '<p class="md-p">' + s + "</p>";
  s = s.replace(/<p class="md-p"><\/p>/g, "");
  s = s.replace(/<p class="md-p">(<pre[\s\S]*?<\/pre>)<\/p>/g, "$1");
  s = s.replace(/<p class="md-p">(<ul[\s\S]*?<\/ul>)<\/p>/g, "$1");
  s = s.replace(/<p class="md-p">(<ol[\s\S]*?<\/ol>)<\/p>/g, "$1");
  return s;
}

function appendMessage(role, content, animate = true, imageData = null) {
  const div = document.createElement("div");
  div.className = `message ${role}`;
  if (!animate) div.style.animation = "none";
  if (role === "user") {
    let extra = "";
    if (imageData) {
      extra = `<img class="msg-image" src="${imageData}" alt="Attached" />`;
    }
    const fileMatch = String(content).match(/^(?:📕 PDF:|📄|📎)\s*(.+)$/);
    if (!imageData && fileMatch) {
      const fname = fileMatch[1].replace(/\s*\(\d+\s*KB\)\s*$/i, "").trim();
      const isPdfCard = /pdf/i.test(content) || /\.pdf/i.test(fname);
      extra = `<div class="file-card"><div class="file-card-icon">${isPdfCard ? "📕" : "📄"}</div><div class="file-card-info"><div class="file-card-name">${escapeHtml(fname)}</div><div class="file-card-meta">${isPdfCard ? "PDF document" : "Document"}</div></div></div>`;
      content = "";
    }
    div.innerHTML = `<div class="bubble">${extra}${content ? escapeHtml(content) : ""}</div>`;
  } else {
    div.innerHTML = `<div class="bubble ai-text"><div class="md-body">${formatMarkdown(content)}</div>
      <div class="msg-actions">
        <button class="msg-action-btn copy-btn" title="Copy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>
        <button class="msg-action-btn speak-btn" title="Speak"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg></button>
        <button class="msg-action-btn regen-btn" title="Regenerate"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></button>
      </div>
    </div>`;
  }
  messagesEl.appendChild(div);
  const copyBtn = div.querySelector(".copy-btn");
  if (copyBtn) copyBtn.addEventListener("click", () => {
    copyToClipboard(content).then((ok) => showToast(ok ? "Copied" : "Copy failed"));
  });
  const speakBtn = div.querySelector(".speak-btn");
  if (speakBtn) speakBtn.addEventListener("click", () => {
    if (!window.speechSynthesis) { showToast("Speech not supported"); return; }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(content);
    utter.rate = 1;
    utter.lang = "en-US";
    window.speechSynthesis.speak(utter);
    showToast("Speaking...");
  });
  const regenBtn = div.querySelector(".regen-btn");
  if (regenBtn) {
    regenBtn.addEventListener("click", () => {
      const chat = getCurrentChat();
      if (!chat || chat.messages.length < 1) return;
      let lastUser = null;
      for (let i = chat.messages.length - 1; i >= 0; i--) {
        if (chat.messages[i].role === "user") { lastUser = chat.messages[i].content; break; }
      }
      if (!lastUser) { showToast("Nothing to regenerate"); return; }
      if (chat.messages.length && chat.messages[chat.messages.length-1].role === "assistant") {
        chat.messages.pop();
        const lastMsg = messagesEl.querySelector(".message.ai:last-child");
        if (lastMsg) lastMsg.remove();
        saveChats();
      }
      abortController = new AbortController();
      setGenerating(true);
      showTyping();
      (async () => {
        try {
          let reply = await callRealAI(lastUser, chat.messages);
          if (reply === null) {
            await new Promise(r => setTimeout(r, 500));
            if (!isGenerating) { hideTyping(); setGenerating(false); return; }
            reply = getSimulatedReply(lastUser);
          }
          if (!isGenerating) { hideTyping(); return; }
          chat.messages.push({ role: "assistant", content: reply });
          saveChats();
          await revealAssistantReply(reply);
        } catch (err) {
          hideTyping();
          if (err.name !== "AbortError") {
            const errMsg = friendlyAIError(err);
            chat.messages.push({ role: "assistant", content: errMsg });
            appendMessage("assistant", errMsg);
            saveChats();
          }
        }
        setGenerating(false);
        abortController = null;
      })();
    });
  }
  scrollToBottom();
}

function getSimulatedReply(userMsg) {
  const lower = userMsg.toLowerCase().trim();
  if (/^(hi|hello|hey|good morning|good afternoon|good evening)\b/.test(lower)) {
    return "Hello! Welcome to Fikury SEEK. I'm here to help you seek deeper insights.\n\nWhat would you like to explore today?";
  }
  if (lower.includes("us president") || lower.includes("president of the united states") || lower.includes("who is the president") || lower.includes("current president")) {
    return "As of 2026, the President of the United States is **Donald J. Trump** (47th President), who returned to office after winning the 2024 election.\n\nHis term began in January 2025.\n\nWould you like information about his administration, policies, or something else?";
  }
  if (lower.includes("who are you") || lower.includes("what are you") || lower.includes("your name")) {
    return "I am **Fikury SEEK** — an AI assistant designed to help you seek deeper knowledge and clearer thinking.\n\nMy design is inspired by the graceful manta ray, navigating the vast ocean of information.";
  }
  if (lower.includes("ocean") || lower.includes("manta") || lower.includes("ray")) {
    return "Manta rays are among the most graceful creatures in the ocean. They can have wingspans over 7 meters and are known for their intelligence and gentle nature.\n\nJust like them, Fikury SEEK aims to move smoothly through complex information.\n\nWhat would you like to know more about?";
  }
  if (lower.includes("quantum")) {
    return "Quantum computing uses superposition and entanglement so that qubits can represent many states at once.\n\nThis allows certain problems (like cryptography, optimization, and molecular simulation) to be solved far faster than on classical computers.\n\nWould you like a simple analogy or more technical detail?";
  }
  if (lower.includes("poem")) {
    return "Here's a short poem:\n\nBeneath the surface, silver wings glide,\nA manta seeks what the currents hide.\nIn depths of thought, we too explore,\nSeeking truth on an endless shore.\n\n— Fikury SEEK";
  }
  if (lower.includes("plan") || lower.includes("productive") || lower.includes("schedule")) {
    return "Here's a clean daily structure:\n\n**Morning**\n• 1 deep-focus block (25–50 min)\n• Short break + movement\n\n**Midday**\n• Review top 3 priorities\n• Batch small tasks\n\n**Afternoon**\n• Creative or collaborative work\n• Plan tomorrow before stopping\n\nWant me to adapt this for a specific goal?";
  }
  if (lower.includes("date") || lower.includes("today") || lower.includes("what day") || lower.includes("current year")) {
    return "I don't have a live clock in this offline version, but the current year is **2026**.\n\nFor the exact date and time, please check your phone's clock.\n\nHow else can I help you?";
  }
  const defaults = [
    "That's an interesting question. Here's a clear take:\n\nI can give you a structured overview or go deeper on any part you choose. What angle would you like?",
    "Let me break this down simply.\n\n1. Core idea\n2. Why it matters\n3. Practical next step\n\nWhich part should I expand?",
    "Good question. While I currently run with offline knowledge, I can still give you a solid, reasoned answer based on established information.\n\nWould you like a short summary or a detailed explanation?"
  ];
  return defaults[Math.floor(Math.random() * defaults.length)];
}

async function callRealAI(userMessage, history) {
  const cfg = loadAIConfig();
  if (cfg.provider === "offline") return null;
  if (cfg.provider === "backend") {
    const res = await fetch("/.netlify/functions/ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: abortController ? abortController.signal : undefined,
      body: JSON.stringify({ provider: "gemini", model: cfg.model || "gemini-3.6", messages: history })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || err.detail || ("Backend error " + res.status));
    }
    const data = await res.json();
    if (!data.reply) throw new Error("Empty backend reply");
    return data.reply;
  }
  if (!cfg.apiKey) return null;
  if (cfg.provider === "gemini") {
    let model = (cfg.model || "gemini-3.6").trim();
    const aliases = { "1.5": "gemini-1.5-flash", "2.0": "gemini-2.0-flash", "2.5": "gemini-2.5-flash", "3.5": "gemini-3.5", "3.6": "gemini-3.6", "3.5-pro": "gemini-3.5-pro", "3.6-pro": "gemini-3.6-pro" };
    if (aliases[model]) model = aliases[model];
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cfg.apiKey}`;
    const contents = [];
    for (const m of history) {
      const role = m.role === "assistant" ? "model" : "user";
      const parts = [];
      if (m.image && m.image.startsWith("data:image")) {
        const match = m.image.match(/^data:(image\/[\w+.-]+);base64,(.+)$/);
        if (match) parts.push({ inline_data: { mime_type: match[1], data: match[2] } });
      }
      if (m.fileData && m.fileData !== "[pdf-in-memory]" && (m.mimeType === "application/pdf" || /\.pdf$/i.test(m.content || "") || String(m.fileData).indexOf("base64,") > -1)) {
        const match = String(m.fileData).match(/^data:([^;]+);base64,(.+)$/);
        if (match && match[2] && match[2].length < 5500000) {
          parts.push({ inline_data: { mime_type: "application/pdf", data: match[2] } });
        } else if (match && match[2]) {
          parts.push({ text: "[PDF attached but too large to upload; please ask based on filename or paste key text.]" });
        }
      }
      if (m.fileText) parts.push({ text: "Document content:\n" + m.fileText });
      if (m.content) {
        const clean = m.content.replace(/^📷 Image$/, "Please look at this image.").replace(/^📕 PDF:.*/, "Please analyze this PDF.");
        if (clean && !parts.some(p => p.text === clean)) parts.push({ text: clean });
      }
      if (parts.length) contents.push({ role, parts });
    }
    if (lastAttachment && lastAttachment.data && contents.length) {
      let lastUser = null;
      for (let i = contents.length - 1; i >= 0; i--) {
        if (contents[i].role === "user") { lastUser = contents[i]; break; }
      }
      if (lastUser) {
        const hasInline = (lastUser.parts || []).some(function(p) { return p.inline_data; });
        if (!hasInline) {
          if (lastAttachment.type === "pdf") {
            const match = String(lastAttachment.data).match(/^data:[^;]+;base64,(.+)$/);
            if (match && match[1].length < 5500000) {
              lastUser.parts.unshift({ inline_data: { mime_type: "application/pdf", data: match[1] } });
            }
          } else if (lastAttachment.type === "image") {
            const match = String(lastAttachment.data).match(/^data:(image\/[^;]+);base64,(.+)$/);
            if (match) {
              lastUser.parts.unshift({ inline_data: { mime_type: match[1], data: match[2] } });
            }
          }
        }
      }
    }
    if (userMessage && (!contents.length || contents[contents.length-1].role !== "user" || (contents[contents.length-1].parts && !contents[contents.length-1].parts.some(p => p.text === userMessage)))) {
      if (contents.length && contents[contents.length-1].role === "user") {
        contents[contents.length-1].parts.push({ text: userMessage });
      } else {
        contents.push({ role: "user", parts: [{ text: userMessage }] });
      }
    }
    const systemText = (cfg.deepThink
      ? "You are Fikury SEEK in Deep Think mode. Reason step by step carefully before answering. Structure answers clearly with short sections when useful. Be accurate; if unsure about recent facts, say so."
      : "You are Fikury SEEK, a helpful AI assistant. Be clear, accurate, and concise. Use short sections or bullets when helpful. For current events, prefer the latest information you have and say if unsure.");
    const body = { contents, systemInstruction: { parts: [{ text: systemText }] } };
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: abortController ? abortController.signal : undefined,
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error("Gemini error: " + res.status + " | " + errText.slice(0, 200));
    }
    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!text) throw new Error("No response from Gemini. Check model name.");
    return text;
  }
  const model = cfg.model || "gpt-4o-mini";
  const url = cfg.baseUrl + "/chat/completions";
  const messages = history.map(m => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.content }));
  if (!messages.length || messages[messages.length-1].content !== userMessage) {
    messages.push({ role: "user", content: userMessage });
  }
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.apiKey },
    body: JSON.stringify({ model, messages, temperature: 0.7 })
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error("API error: " + res.status + " " + err.slice(0, 120));
  }
  const data = await res.json();
  const text = data?.choices?.[0]?.message?.content;
  if (!text) throw new Error("No response from API");
  return text;
}

function friendlyAIError(err) {
  const raw = (err && err.message) ? String(err.message) : String(err || "Unknown error");
  const lower = raw.toLowerCase();
  if (lower.includes("429") || lower.includes("quota") || lower.includes("rate limit") || lower.includes("resource_exhausted")) {
    return "⚠️ Rate limit reached.\n\nGoogle paused requests for a short time. Please wait 1–2 minutes, then try again.\n\nTip: send messages more slowly. Your daily limit may still be available.";
  }
  if (lower.includes("401") || lower.includes("403") || lower.includes("api key") || lower.includes("permission")) {
    return "⚠️ API key error.\n\nCheck your key in AI Settings, or create a new key at Google AI Studio.";
  }
  if (lower.includes("404") || lower.includes("not found") || lower.includes("is not found")) {
    return "⚠️ Model not available for your API key.\n\nOpen AI Settings and tap a model chip that works for you (e.g. 3.6 or 3.5).\nYou can also type the exact model name Google gave you.";
  }
  if (lower.includes("network") || lower.includes("failed to fetch")) {
    return "⚠️ Network error.\n\nCheck your internet connection and try again.";
  }
  let short = raw.replace(/\s+/g, " ").trim();
  if (short.length > 180) short = short.slice(0, 180) + "…";
  return "⚠️ " + short;
}

function streamTextIntoBubble(bubbleEl, fullText) {
  return new Promise((resolve) => {
    const words = fullText.split(/(\s+)/);
    let idx = 0;
    bubbleEl.textContent = "";
    function tick() {
      if (!isGenerating) { bubbleEl.textContent = fullText; resolve(); return; }
      if (idx >= words.length) { bubbleEl.textContent = fullText; resolve(); return; }
      const take = fullText.length < 80 ? 1 : (fullText.length < 300 ? 2 : 3);
      const chunk = words.slice(idx, idx + take).join("");
      idx += take;
      bubbleEl.textContent += chunk;
      scrollToBottom();
      const delay = fullText.length < 100 ? 45 : (fullText.length < 400 ? 28 : 18);
      setTimeout(tick, delay);
    }
    tick();
  });
}

async function sendMessage(text) {
  const content = (text || userInput.value).trim();
  if (!content || isTyping) return;
  if (!currentChatId) {
    let title = content.replace(/\s+/g, " ").trim();
    if (/^\d{12,}$/.test(title)) title = "Chat";
    if (title.length > 28) title = title.slice(0, 28) + "…";
    if (!title) title = "New chat";
    createChat(title);
  }
  const chat = getCurrentChat();
  welcomeScreen.style.display = "none";
  messagesEl.classList.add("active");
  chat.messages.push({ role: "user", content });
  appendMessage("user", content);
  userInput.value = "";
  autoResize();
  updateSendBtn();
  saveChats();
  renderHistory();
  abortController = new AbortController();
  setGenerating(true);
  showTyping();
  try {
    let reply = await callRealAI(content, chat.messages);
    if (reply === null) {
      await new Promise((r) => setTimeout(r, 500 + Math.random() * 700));
      if (!isGenerating) { hideTyping(); setGenerating(false); return; }
      reply = getSimulatedReply(content);
    }
    if (!isGenerating) { hideTyping(); return; }
    chat.messages.push({ role: "assistant", content: reply });
    saveChats();
    await revealAssistantReply(reply);
  } catch (err) {
    hideTyping();
    if (err.name === "AbortError") { showToast("Stopped"); } else {
      const errMsg = friendlyAIError(err);
      chat.messages.push({ role: "assistant", content: errMsg });
      appendMessage("assistant", errMsg);
      saveChats();
      showToast("AI request failed");
    }
  }
  setGenerating(false);
  abortController = null;
}

function compressImageDataUrl(dataUrl, maxSide, quality) {
  return new Promise(function(resolve) {
    maxSide = maxSide || 1280;
    quality = quality || 0.72;
    const img = new Image();
    img.onload = function() {
      let w = img.width, h = img.height;
      if (w < 1 || h < 1) { resolve(dataUrl); return; }
      if (w > maxSide || h > maxSide) {
        if (w > h) { h = Math.round(h * maxSide / w); w = maxSide; }
        else { w = Math.round(w * maxSide / h); h = maxSide; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      try { resolve(canvas.toDataURL("image/jpeg", quality)); } catch (e) { resolve(dataUrl); }
    };
    img.onerror = function() { resolve(dataUrl); };
    img.src = dataUrl;
  });
}

function handleFileSelect(e, type) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const sizeKB = Math.round(file.size / 1024);
  const fullName = file.name || "file";
  const name = fullName.length > 28 ? fullName.slice(0, 25) + "…" : fullName;
  showToast((type || "File") + ": " + name + " (" + sizeKB + " KB)");
  try { if (!currentChatId) createChat(name); } catch (err) { showToast("Could not start chat"); return; }
  const chat = getCurrentChat();
  if (!chat) { showToast("Chat error"); return; }
  welcomeScreen.style.display = "none";
  messagesEl.classList.add("active");
  const fname = fullName;
  const ftype = file.type || "";
  const isImage = ftype.startsWith("image/") || /\.(png|jpe?g|gif|webp|bmp|svg|heic|heif)$/i.test(fname) || (type && /camera|photo/i.test(type) && (!ftype || ftype === "application/octet-stream"));
  const isText = ftype.startsWith("text/") || /\.(txt|md|csv|json|xml|html?|log|js|ts|py|java|c|cpp|h|css|sql|ya?ml|ini|cfg|env|rtf)$/i.test(fname);
  const isPdf = ftype === "application/pdf" || /\.pdf$/i.test(fname);
  const isDocx = /\.docx$/i.test(fname) || ftype === "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
  const isOffice = /\.(doc|docx|xls|xlsx|ppt|pptx|odt|ods|odp|epub)$/i.test(fname) || /officedocument|msword|ms-excel|ms-powerpoint/i.test(ftype);

  function showUserFile(msgContent, extra) {
    extra = extra || {};
    chat.messages.push(Object.assign({ role: "user", content: msgContent }, extra));
    appendMessage("user", msgContent, true, extra.image || null);
    try {
      const slim = JSON.parse(JSON.stringify(chats));
      slim.forEach(function(c) {
        (c.messages || []).forEach(function(m) {
          if (m.fileData && String(m.fileData).length > 50000) m.fileData = "[pdf-in-memory]";
          if (m.image && String(m.image).length > 200000) m.image = m.image.slice(0, 100) + "...";
        });
      });
      localStorage.setItem("fikury_chats", JSON.stringify(slim));
    } catch (se) { try { saveChats(); } catch (e2) {} }
    renderHistory();
    scrollToBottom();
  }

  async function runAI(prompt) {
    abortController = new AbortController();
    setGenerating(true);
    showTyping();
    showToast("Analyzing...");
    let reply = null;
    try { reply = await callRealAI(prompt, chat.messages); } catch (err) {
      if (err && err.name === "AbortError") { hideTyping(); setGenerating(false); abortController = null; return; }
      reply = friendlyAIError(err);
    }
    if (!reply) {
      reply = "I received **" + name + "** in the chat.\n\nTo get an AI summary of this file:\n1. Open the app on **https://** (not content://)\n2. AI Settings → Google Gemini + API key\n3. Model **3.6** or **3.5** → Save\n4. Attach the file again\n\nOr type a question about the file below.";
    }
    hideTyping();
    chat.messages.push({ role: "assistant", content: reply });
    try { saveChats(); } catch (e) {}
    try { await revealAssistantReply(reply); } catch (re) { appendMessage("assistant", reply); }
    setGenerating(false);
    abortController = null;
  }

  if (isDocx) {
    const fr = new FileReader();
    fr.onerror = function() { showToast("Could not read Word file"); };
    fr.onload = async function(ev) {
      let text = "";
      try { if (window.mammoth) { const result = await window.mammoth.extractRawText({ arrayBuffer: ev.target.result }); text = (result.value || "").trim(); } } catch (err) { text = ""; }
      const preview = text.slice(0, 2500);
      const msgContent = "📄 " + name + (text ? ("\\n\\n" + preview + (text.length > 2500 ? "\\n...(truncated)" : "")) : "");
      showUserFile(msgContent, { fileText: text.slice(0, 12000) });
      await runAI("Please summarize or analyze this Word document.");
    };
    fr.readAsArrayBuffer(file);
    e.target.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onerror = function() { showToast("Could not read file"); showUserFile("📎 " + name + " (" + sizeKB + " KB)"); };
  reader.onload = async function(ev) {
    let dataUrl = ev.target.result;
    let msgContent = "";
    let extra = {};
    try {
      if (isImage) {
        msgContent = "📷 Image";
        try { dataUrl = await compressImageDataUrl(dataUrl, 1280, 0.7); } catch (ce) {}
        extra.image = dataUrl;
        lastAttachment = { type: "image", data: dataUrl, mimeType: "image/jpeg", name: fullName };
      } else if (isText) {
        try { const text = atob(String(dataUrl).split(",")[1] || ""); const preview = text.slice(0, 3000); msgContent = "📄 " + name + "\\n\\n" + preview + (text.length > 3000 ? "\\n...(truncated)" : ""); extra.fileText = text.slice(0, 12000); } catch (te) { msgContent = "📄 " + name; }
      } else if (isPdf) {
        msgContent = "📕 PDF: " + name;
        if (typeof dataUrl === "string" && dataUrl.indexOf("base64,") > -1) {
          dataUrl = "data:application/pdf;base64," + dataUrl.split("base64,")[1];
        }
        extra.fileData = dataUrl;
        extra.mimeType = "application/pdf";
        lastAttachment = { type: "pdf", data: dataUrl, mimeType: "application/pdf", name: fullName };
      } else if (isOffice) { msgContent = "📎 " + name + " (" + sizeKB + " KB)"; }
      else { msgContent = "📎 " + name + " (" + sizeKB + " KB)"; }
      showUserFile(msgContent, extra);
      if (isImage) { await runAI("Describe this image in clear detail: objects, scene, text if any, and anything notable."); }
      else if (isText) { await runAI("Please summarize or analyze the content of this document."); }
      else if (isPdf) { await runAI("You have the PDF file attached. Read it and provide a clear summary of its main sections and key points. Do not only acknowledge the filename — use the document content."); }
      else { await runAI("I attached a file named " + fullName + ". Acknowledge it and say what you can help with."); }
    } catch (err) { showToast("File error: " + (err.message || "failed")); showUserFile("📎 " + name + " (" + sizeKB + " KB)"); }
  };
  if (isImage || isPdf) { reader.readAsDataURL(file); } else if (isText) { reader.readAsDataURL(file); } else { showUserFile("📎 " + name + " (" + sizeKB + " KB)"); runAI("I attached a file named " + fullName + ". Acknowledge it."); }
  e.target.value = "";
}

// Microphone
let recognition = null;
let isListening = false;

function initSpeech() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;
  const rec = new SpeechRecognition();
  rec.continuous = false;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  rec.lang = (navigator.language || "en-US");
  rec.onstart = () => {
    isListening = true;
    micBtn.style.color = "#ef4444";
    micBtn.style.background = "rgba(239,68,68,0.2)";
    showToast("Listening... Speak now");
  };
  rec.onresult = (event) => {
    let transcript = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    userInput.value = transcript;
    autoResize();
    updateSendBtn();
  };
  rec.onerror = (event) => {
    isListening = false;
    micBtn.style.color = "";
    micBtn.style.background = "";
    const err = event.error;
    if (err === "not-allowed") showToast("Microphone blocked. Tap the lock icon in address bar → Allow Microphone.");
    else if (err === "service-not-allowed") showToast("Speech service blocked. Check Chrome site settings.");
    else if (err === "network") showToast("Network error. Check your internet connection.");
    else if (err === "no-speech") showToast("No speech detected. Try again.");
    else if (err === "audio-capture") showToast("No microphone found or it is busy.");
    else if (err !== "aborted") showToast("Mic error: " + err);
  };
  rec.onend = () => {
    isListening = false;
    micBtn.style.color = "";
    micBtn.style.background = "";
  };
  return rec;
}
recognition = initSpeech();

micBtn.addEventListener("click", async () => {
  if (!window.isSecureContext && location.protocol !== "https:" && location.hostname !== "localhost") {
    showToast("Mic needs HTTPS. Open your Netlify site (not local file).");
    return;
  }
  if (!recognition) { recognition = initSpeech(); }
  if (!recognition) { showToast("Speech not supported. Use Chrome or Edge on HTTPS."); return; }
  if (isListening) { try { recognition.stop(); } catch (e) {} isListening = false; micBtn.style.color = ""; micBtn.style.background = ""; showToast("Stopped listening"); return; }
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); stream.getTracks().forEach(t => t.stop()); } catch (permErr) { showToast("Allow microphone in the browser address bar."); return; }
    }
    try { recognition.abort(); } catch (e) {}
    recognition.start();
  } catch (err) {
    try { recognition = initSpeech(); if (recognition) recognition.start(); else throw err; } catch (err2) { showToast("Could not start mic. Allow permission, use Chrome on HTTPS."); }
  }
});
